# ============================================================
# wells.yaml — Well registry for the drilling anomaly dashboard
# ============================================================

wells:
  - id: TharJath5
    display_name: "Thar Jath-5"
    type: vertical
    field: "Sudan Block 5A"
    country: "Sudan"
    data_path: "data/wells/TharJath5/drilling_reports.csv"
    survey_path: null

  - id: TharJath8
    display_name: "Thar Jath-8"
    type: deviated
    field: "Sudan Block 5A"
    country: "Sudan"
    data_path: "data/wells/TharJath8/drilling_reports.csv"
    survey_path: "data/wells/TharJath8/survey.csv"

  - id: TharJath11
    display_name: "Thar Jath-11"
    type: deviated                                          # ← was vertical
    field: "Sudan Block 5A"
    country: "Sudan"
    data_path: "data/processed/all_reports.csv"
    survey_path: "data/wells/TharJath11/survey.csv"         # ← new

# ============================================================
# Branding — controlled at deploy level only
# ============================================================
branding:
  show_logo: true
  show_well_name: true
  show_client_name: false                 # ← NEW: hide "PETRONAS CARIGALI"
  anonymize_wells: true
  anonymized_names:
    TharJath5:  "Well A"
    TharJath8:  "Well B"
    TharJath11: "Well C"

  show_rig_name: false                    # ← NEW: mask rig name
  rig_name_masked: "XXXX"                 # ← NEW: what to show instead

  show_background: true
  background_path: "assets/rig_background.jpg"
  background_opacity: 0.40
  client_name: "PETRONAS CARIGALI"
  logo_path: "assets/petronas_carigali_logo.png"

ui:
  default_well_id: "TharJath5"